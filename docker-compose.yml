services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      # Override host-oriented defaults from .env so containers reach each other correctly.
      QDRANT_URL: http://qdrant:6333
      # SQLite file lives in the mounted ./backend/data volume so it survives rebuilds.
      DATABASE_URL: sqlite:////app/data/repomind.db
      # Ollama runs on the host, not in this compose file -- host.docker.internal reaches it
      # on Docker Desktop (Windows/Mac) out of the box; extra_hosts below covers Linux.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/repositories:/app/repositories
      - ./backend/uploads:/app/uploads
      - ./backend/generated_reports:/app/generated_reports
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  qdrant_data:
